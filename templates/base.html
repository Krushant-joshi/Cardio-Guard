<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}CardioGuard{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    {% block extra_css %}{% endblock %}
  </head>

  <body>
    <nav class="navbar navbar-expand-lg app-nav">
      <div class="container">
        <a class="navbar-brand brand" href="{{ url_for('home') }}">
          <span class="brand-icon"
            ><i class="fa-solid fa-heart-pulse"></i
          ></span>
          <span>CardioGuard</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('home') }}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('about') }}">Dataset</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('visuals') }}">Visuals</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('model_info') }}"
                >Pipeline</a
              >
            </li>
            <li class="nav-item ms-lg-3">
              <a class="btn btn-brand" href="{{ url_for('predict') }}"
                >Predict Risk</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="main-wrapper">{% block content %}{% endblock %}</main>

    <footer class="app-footer">
      <div class="container footer-wrap">
        <p class="mb-0">&copy; 2026 CardioGuard by Krushant Joshi</p>
        <small>Created and maintained by Krushant Joshi</small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
